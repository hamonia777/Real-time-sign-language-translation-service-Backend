# EC2 배포용. 서버의 /opt/sign-backend 에 .env, Caddyfile 과 함께 둔다.
services:
  app:
    image: sign-backend:latest
    container_name: sign-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 서버에서는 같은 compose 네트워크의 redis 컨테이너를 쓴다 (.env 의 127.0.0.1 을 덮어씀)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SIGN_VIDEO_DIR: /app/videos
      # https://signlanguagelab.scarlett-project.cloud/sign/ 아래에서 서비스한다
      APP_BASE_PATH: /sign
      # 카카오 개발자 콘솔의 Redirect URI 와 똑같아야 한다 (.env 의 로컬 값을 덮어씀)
      KAKAO_REDIRECT_URI: https://signlanguagelab.scarlett-project.cloud/sign/api/v1/auth/kakao/auth
    volumes:
      # 수어 학습 영상은 이미지에 넣지 않고 서버 폴더를 읽기 전용으로 연결한다
      - ./videos:/app/videos:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sign-redis
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: sign-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
