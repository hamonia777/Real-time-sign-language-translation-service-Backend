<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지문자 학습</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/learning.css?v=260525">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="learning-page">
    <header class="main-header">
        <div class="wide-container header-inner">
            <div class="logo" onclick="location.href='home.html'">
                <img src="../logo.png" alt="로고" class="logo-img">
                <span>수어 연구소</span>
            </div>
            <nav class="nav-bar">
                <a href="learning.html" style="font-weight:500; color:#0C0C0C;">수어학습</a>
                <a href="search.html">수어검색</a>
                <a href="support.html">고객지원</a>
                <a href="mypage.html">마이페이지</a>
            </nav>
            <button class="login-btn" id="headerAuthBtn">로그아웃</button>
        </div>
    </header>

    <main class="learning-main">
        <div class="learn-wrap">
            <!-- learn-title 제거 (피그마 디자인에 없음) -->

            <div class="stepper-row" id="stepper">
                <div class="node active" data-step="1"><div class="dot">1</div><span>영상 시청</span></div>
                <div class="line"></div>
                <div class="node" data-step="2"><div class="dot">2</div><span>환경 세팅</span></div>
                <div class="line"></div>
                <div class="node" data-step="3"><div class="dot">3</div><span>수어 실습</span></div>
                <div class="line"></div>
                <div class="node" data-step="4"><div class="dot">4</div><span>학습 완료</span></div>
            </div>

            <!-- Step 1: 영상 시청 -->
            <section id="step1" class="step-view">
                <div class="learn-body">
                    <div class="video-box">
                        <!-- 가령: 5월 11일 : 수정 내용 - 1단계 학습 영상 표시 영역 추가 -->
                        <video id="lessonVideo" class="learn-video" controls playsinline preload="metadata" style="display:none;"></video>
                        <div class="char-huge" id="targetCharBig">?</div>
                        <div class="video-fallback" id="videoFallback" style="display:none;"></div>
                    </div>
                    <aside class="side-info">
                        <h3>학습 단어 정보</h3>
                        <div class="divider"></div>
                        <div class="target-char" id="targetCharSide">안녕하세요</div>
                        <div class="word-desc">가장 간단한 인삿말입니다.</div>
                    </aside>
                </div>
                <div class="learn-footer">
                    <button class="btn-secondary" onclick="history.back()">이전</button>
                    <button class="btn-primary" id="toStep2">다음</button>
                </div>
            </section>

            <!-- Step 2: 환경 세팅 -->
            <section id="step2" class="step-view" style="display:none;">
            <div class="learn-body">
                <div class="camera-wrap">
                <div class="camera-box" id="cameraBox2">
                    <video id="video2" autoplay playsinline muted></video>
                </div>
                <div class="camera-status-bar">
                    <span class="camera-status-text" id="cameraStatus2">카메라 상태 : 확인 중...</span>
                    <button class="camera-check-btn" id="cameraCheckBtn">카메라 확인</button>
                </div>
                </div>
                <aside class="side-info">
                <h3>세팅 가이드</h3>
                <div class="divider"></div>
                <div class="guide-item">
                    <div class="guide-icon"><img src="../images/hand.png" alt="손"></div>
                    <span>오른쪽 손으로 진행</span>
                </div>
                <div class="guide-item">
                    <div class="guide-icon"><img src="../images/background.png" alt="배경"></div>
                    <span>배경 정리</span>
                </div>
                <div class="guide-item">
                    <div class="guide-icon"><img src="../images/person.png" alt="상반신"></div>
                    <span>상반신 노출</span>
                </div>
                <div class="guide-item">
                    <div class="guide-icon"><img src="../images/light.png" alt="조명"></div>
                    <span>밝은 조명 확보</span>
                </div>
                </aside>
            </div>
            <div class="learn-footer">
                <button class="btn-secondary" id="backTo1">이전</button>
                <button class="btn-primary" id="toStep3">다음</button>
            </div>
            </section>

            <!-- Step 3: 수어 실습 -->
            <section id="step3" class="step-view" style="display:none;">
                <div class="learn-body">
                    <div class="camera-wrap">
                    <div class="camera-box" id="cameraBox3" style="position:relative;">
                        <video id="video3" autoplay playsinline muted></video>
                        <div class="camera-timer-wrap" id="cameraTimerWrap" style="display:none;">
                        <svg viewBox="0 0 44 44">
                            <circle class="timer-track" cx="22" cy="22" r="17"/>
                            <circle class="timer-fill" id="timerFill" cx="22" cy="22" r="17"/>
                        </svg>
                        <div class="camera-timer-text" id="cameraTimerText">10s</div>
                        </div>
                    </div>
                    <div class="camera-status-bar">
                        <span class="camera-status-text" id="statusLine3">WebSocket 연결 대기...</span>
                    </div>
                    </div>
                    <aside class="side-info">
                    <h3>실시간 채점</h3>
                    <div class="divider"></div>
                    <div class="score-gauge-wrap">
                        <div class="score-target">
                            <div class="score-label">현재 실습 단어 :</div>
                            <div class="target-char" id="targetChar3">?</div>
                        </div>
                        <div class="score-display">
                            <div class="score-num" id="scoreVal">0점</div>
                        </div>
                    </div>
                    <div class="score-meta-row">
                        <div>
                            <div class="score-label">통과 기준</div>
                            <div class="score-value">80점</div>
                        </div>
                        <div>
                            <div class="score-label">시도 횟수</div>
                            <div class="score-value"><span id="attemptLabel">1</span>/3</div>
                        </div>
                    </div>

                    <div class="top3" id="top3Box"></div>
                    <div class="fail-msg" id="failMsg" style="display:none;">불통과하였습니다.</div>
                    </aside>
                </div>
                <div class="learn-footer">
                    <button class="btn-secondary" id="backTo2">이전</button>
                    <button class="btn-primary" id="confirmStep3">확인</button>
                </div>
                </section>

            <!-- Step 4: 학습 완료 -->
            <section id="step4" class="step-view" style="display:none;">
                <div class="step4-wrap">
                    <div class="step4-congrats">
                        <p>축하합니다!</p>
                        <p>학습을 완료했습니다!</p>
                    </div>
                    <div class="step4-card">
                        <div class="step4-left">
                            <div class="step4-label">현재 실습 단어 :</div>
                            <div class="step4-word" id="doneChar">?</div>
                            <div class="step4-label" style="margin-top:16px;">정확도 :</div>
                            <div class="step4-score"><span id="doneScore">0</span>점</div>
                        </div>
                        <div class="step4-right">
                            <button class="btn-secondary" id="retryBtn">다시 시도</button>
                            <button class="btn-primary" onclick="location.href='learning.html'">학습 목록</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <!-- 가령: 5월 11일 : 수정 내용 - 영상 연결 스크립트를 학습 페이지 스크립트와 분리 -->
    <script src="../js/sign_video.js?v=260511"></script>
    <script src="../js/sign_learn.js?v=260525"></script>
</body>
</html>
