# CI/CD
#
# - push / pull_request : 의존성 설치 → 스모크 테스트 (test job)
# - push to master      : 이미지 빌드 → ECR 푸시 → SSM 으로 EC2 에 배포 → 헬스체크 (deploy job)
#
# [필요한 GitHub 시크릿 - Settings > Secrets and variables > Actions]
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY : IAM 사용자 github-actions-sign-deploy 의 액세스 키
#     (권한: ECR 푸시 + 이 인스턴스에 SSM 명령 실행만. 조직 SCP 가 OIDC 를 막아 액세스 키를 쓴다)
#
#   - AWS 인증: 위 액세스 키
#   - 서버 접속: SSH 대신 AWS SSM (보안 그룹의 22번 포트를 열 필요 없음)
#   - 이미지 pull: EC2 인스턴스 역할로 ECR 에서 받는다
# AWS 쪽 준비는 scripts/setup_aws_ssm_deploy.sh 참고.
#
# 서버의 /opt/sign-backend/.env 와 videos/ 는 저장소에 없으며 배포로 바뀌지 않는다.

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: sign-backend
  INSTANCE_ID: i-06f91de78a10949a6
  SERVICE_URL: https://signlanguagelab.scarlett-project.cloud/sign/

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # 테스트에서는 실제 DB/Redis 에 접속하지 않는다. Settings 검증용 더미 값만 준다.
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ci
      JWT_SECRET_KEY: ci-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      KAKAO_REST_API_KEY: ci
      KAKAO_REDIRECT_URI: http://localhost/callback
      KAKAO_CLIENT_SECRET: ci
      # 테스트 전용 키 (운영 키 아님)
      TOKEN_ENCRYPTION_KEY: 2JXdzt_X0pQOXRZyjHjc74KRn7F1MTMZHVMAXpByvCk=
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU torch
        run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: pytest -q tests

  deploy:
    name: Build & deploy (ECR + SSM)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)
          CADDY_B64=$(base64 -w0 Caddyfile)

          # 서버에서 실행할 명령: 설정 파일 갱신 → ECR 로그인 → 새 이미지 pull → 재시작
          jq -n --arg compose "$COMPOSE_B64" --arg caddy "$CADDY_B64" \
                --arg registry "$REGISTRY" --arg image "$IMAGE" --arg region "$AWS_REGION" '{commands: [
            "set -e",
            "export PATH=$PATH:/snap/bin",
            "cd /opt/sign-backend",
            "echo \($compose) | base64 -d > docker-compose.yml",
            "echo \($caddy) | base64 -d > Caddyfile",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
            "docker pull \($image)",
            "docker tag \($image) sign-backend:latest",
            "docker compose up -d",
            "docker exec sign-caddy caddy reload --config /etc/caddy/Caddyfile",
            "docker image prune -f",
            "docker ps --format \"{{.Names}} {{.Status}}\""
          ]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # 이미지 pull 시간이 있어 최대 15분까지 기다린다
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL" || true)
            [ "$CODE" = "200" ] && { echo "OK: $SERVICE_URL"; exit 0; }
            sleep 10
          done
          echo "Health check failed: last status $CODE"
          exit 1
